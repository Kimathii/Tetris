<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Premium Tetris</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            /* Override with dvh where supported */
            overflow: hidden;
            touch-action: none;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .hourglass-container {
            width: 40px;
            height: 50px;
            position: relative;
            margin-bottom: 30px;
        }

        .hourglass-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #00f0f0;
            stroke-width: 2;
            animation: hourglass-flip 3s ease-in-out infinite;
        }

        .sand-top {
            fill: #00f0f0;
            animation: sand-empty 3s linear infinite;
        }

        .sand-bottom {
            fill: #00f0f0;
            animation: sand-fill 3s linear infinite;
        }

        .sand-stream {
            stroke: #00f0f0;
            stroke-dasharray: 4 4;
            animation: sand-stream-flow 0.5s linear infinite;
        }

        @keyframes hourglass-flip {

            0%,
            45% {
                transform: rotate(0deg);
            }

            50%,
            95% {
                transform: rotate(180deg);
            }

            100% {
                transform: rotate(180deg);
            }
        }

        @keyframes sand-empty {
            0% {
                transform: scaleY(1);
                transform-origin: 50% 50%;
            }

            45%,
            100% {
                transform: scaleY(0);
                transform-origin: 50% 50%;
            }
        }

        @keyframes sand-fill {
            0% {
                transform: scaleY(0);
                transform-origin: 50% 90%;
            }

            45%,
            100% {
                transform: scaleY(1);
                transform-origin: 50% 90%;
            }
        }

        @keyframes sand-stream-flow {
            to {
                stroke-dashoffset: -8;
            }
        }

        #hint-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #00f0f0;
            text-shadow: 0 0 10px rgba(0, 240, 240, 0.5);
            letter-spacing: 1px;
            text-align: center;
            min-height: 24px;
            padding: 0 20px;
            transition: opacity 0.4s ease;
            text-transform: uppercase;
        }

        .main-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4dvh;
            /* Increased gap from 2dvh for better breathing room */
            height: 100dvh;
            max-width: 100vw;
            padding: 10px;
            box-sizing: border-box;
        }

        .header {
            width: min(300px, 90vw);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(20, 20, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .header-stat {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .header-next-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-next-block h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            margin: 0 0 4px 0;
            color: #00f0f0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-stat h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            margin: 0;
            color: #00f0f0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-stat p {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .header .btn-restart {
            background: rgba(0, 240, 240, 0.1);
            border: 1px solid rgba(0, 240, 240, 0.3);
            color: #fff;
            padding: 6px 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
        }

        #game-container {
            position: relative;
            /* Responsive sizing while maintaining 1:2 ratio */
            height: min(600px, 70vh);
            max-width: 100%;
            aspect-ratio: 1 / 2;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: #111111;
            overflow: hidden;
            flex-shrink: 1;
            /* Allow board to shrink if needed */
        }

        #game-container canvas {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            display: block;
        }

        #game-over-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-over-overlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(20px, 5vh, 32px);
            color: #ff0055;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        .overlay-btn {
            background: rgba(0, 240, 240, 0.1);
            border: 1px solid rgba(0, 240, 240, 0.3);
            color: #fff;
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px;
            width: 160px;
            text-align: center;
        }

        #quit-confirm-overlay,
        #thank-you-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 15, 0.93);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #thank-you-overlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(22px, 5vh, 36px);
            color: #00f0f0;
            text-shadow: 0 0 20px rgba(0, 240, 240, 0.5);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        #thank-you-overlay p {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
        }

        .btn-confirm-yes {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid rgba(255, 0, 85, 0.4);
            color: #ff0055;
        }

        .btn-confirm-yes:hover {
            background: rgba(255, 0, 85, 0.2);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .btn-confirm-no {
            background: rgba(0, 240, 240, 0.1);
            border: 1px solid rgba(0, 240, 240, 0.4);
            color: #00f0f0;
        }

        .btn-confirm-no:hover {
            background: rgba(0, 240, 240, 0.2);
            box-shadow: 0 0 15px rgba(0, 240, 240, 0.3);
        }

        .footer {
            width: 100%;
            text-align: center;
            flex-shrink: 0;
            padding: 5px 0;
        }

        .dev-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ── Name Entry Screen ── */
        #name-entry-screen {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 8000;
            gap: 28px;
            padding: 30px;
            box-sizing: border-box;
        }

        #name-entry-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(22px, 5vw, 36px);
            color: #00f0f0;
            text-shadow: 0 0 30px rgba(0, 240, 240, 0.6);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
            text-align: center;
        }

        #name-entry-screen p {
            font-family: 'Inter', sans-serif;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin: -16px 0 0;
            letter-spacing: 1px;
        }

        #player-name-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 240, 0.4);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            letter-spacing: 3px;
            text-align: center;
            padding: 14px 24px;
            border-radius: 10px;
            outline: none;
            width: min(280px, 80vw);
            text-transform: uppercase;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #player-name-input:focus {
            border-color: #00f0f0;
            box-shadow: 0 0 20px rgba(0, 240, 240, 0.25);
        }

        #player-name-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            letter-spacing: 2px;
        }

        #start-game-btn {
            background: linear-gradient(135deg, rgba(0, 240, 240, 0.15), rgba(0, 240, 240, 0.05));
            border: 1px solid rgba(0, 240, 240, 0.5);
            color: #00f0f0;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 14px 40px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
        }

        #start-game-btn:hover {
            background: rgba(0, 240, 240, 0.2);
            box-shadow: 0 0 25px rgba(0, 240, 240, 0.3);
            transform: translateY(-1px);
        }

        #start-game-btn:active {
            transform: translateY(0);
        }

        /* ── Leaderboard (inside game over overlay) ── */
        #leaderboard-panel {
            width: 100%;
            max-width: 240px;
            margin-top: 10px;
        }

        #leaderboard-panel h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: #00f0f0;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0 0 10px;
            text-align: center;
        }

        .lb-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
        }

        .lb-row.lb-highlight {
            background: rgba(0, 240, 240, 0.12);
            border: 1px solid rgba(0, 240, 240, 0.25);
        }

        .lb-rank {
            color: rgba(255, 255, 255, 0.3);
            width: 18px;
            text-align: center;
        }

        .lb-rank.top3 {
            color: #f0a000;
        }

        .lb-name {
            flex: 1;
            padding: 0 8px;
            color: rgba(255, 255, 255, 0.85);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lb-score {
            color: #00f0f0;
            min-width: 52px;
            text-align: right;
        }

        .lb-empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            padding: 10px 0;
        }

        /* Scrollable leaderboard on very small screens */
        #leaderboard-panel .lb-list {
            max-height: 140px;
            overflow-y: auto;
        }

        /* Desktop layout adjustments */
        @media (min-width: 768px) {
            .main-wrapper {
                flex-direction: row;
                justify-content: center;
                gap: 30px;
                padding: 40px;
            }

            .header {
                flex-direction: column;
                width: 150px;
                height: min(600px, 80vh);
                justify-content: flex-start;
                gap: 40px;
                padding: 30px 20px;
            }

            .header-stat h3 {
                font-size: 12px;
            }

            .header-stat p {
                font-size: 20px;
                margin-top: 5px;
            }

            .header .btn-restart {
                width: 100%;
                padding: 12px;
                font-size: 11px;
                margin-top: auto;
            }

            #game-container {
                height: 80vh;
            }

            .footer {
                position: absolute;
                bottom: 15px;
                width: auto;
            }

            /* Larger leaderboard on desktop */
            #leaderboard-panel .lb-list {
                max-height: none;
                overflow-y: visible;
            }
        }

        /* Small screen height fixes */
        @media (max-height: 500px) and (orientation: landscape) {
            .main-wrapper {
                padding: 5px;
                flex-direction: row;
            }

            .header {
                width: auto;
                height: 90%;
                flex-direction: column;
                gap: 10px;
            }

            #game-container {
                height: 80vh;
            }
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen" aria-live="polite">
        <div class="hourglass-container">
            <svg class="hourglass-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Frame -->
                <path d="M25 10 H75 M25 90 H75" stroke="#00f0f0" stroke-width="4" stroke-linecap="round" />
                <path d="M30 15 L70 15 L50 50 L30 85 L70 85 L50 50 L30 15" stroke="#00f0f0" stroke-width="2"
                    fill="none" />
                <!-- Top Sand Triangle -->
                <path class="sand-top" d="M35 20 L65 20 L50 45 Z" fill="#00f0f0" />
                <!-- Bottom Sand Triangle -->
                <path class="sand-bottom" d="M50 55 L35 80 L65 80 Z" fill="#00f0f0" />
                <!-- Stream of Sand -->
                <line class="sand-stream" x1="50" y1="45" x2="50" y2="55" stroke="#00f0f0" stroke-width="2" />
            </svg>
        </div>
        <div id="hint-text">&nbsp;</div>
    </div>

    <!-- Name Entry Screen (shown after loading, before game) -->
    <div id="name-entry-screen" style="display:none;">
        <h1>Kimathi's Tetris</h1>
        <p>Enter your name to play</p>
        <input id="player-name-input" type="text" maxlength="12" placeholder="YOUR NAME" autocomplete="off"
            spellcheck="false" />
        <button id="start-game-btn">Play</button>
    </div>

    <div class="main-wrapper">
        <div class="header">
            <div class="header-stat">
                <h3>Score</h3>
                <p id="score">0000</p>
            </div>
            <div class="header-stat">
                <h3>Level</h3>
                <p id="level">1</p>
            </div>
            <div class="header-next-block">
                <canvas id="next-block-canvas" width="40" height="40"></canvas>
            </div>
            <button class="btn-restart" id="header-restart">Restart</button>
        </div>

        <div id="game-container">
            <div id="game-over-overlay">
                <h2>Game Over</h2>
                <!-- Leaderboard Panel -->
                <div id="leaderboard-panel">
                    <h3>🏆 Top 10</h3>
                    <div class="lb-list" id="leaderboard-list"></div>
                </div>
                <button class="overlay-btn" id="play-again-btn" style="margin-top:12px;">Restart</button>
                <button class="overlay-btn" id="quit-btn"
                    style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);">Quit</button>
            </div>
            <div id="quit-confirm-overlay">
                <h2>Are you sure?</h2>
                <button class="overlay-btn btn-confirm-yes" id="confirm-yes-btn">Yes</button>
                <button class="overlay-btn btn-confirm-no" id="confirm-no-btn">No</button>
            </div>
            <div id="thank-you-overlay">
                <h2>Thank You for Playing!</h2>
                <p>Refresh the page to start over</p>
            </div>
        </div>

        <div class="footer">
            <a href="https://x.com/_Mathias_Jr_" target="_blank" rel="noopener noreferrer" class="dev-link">
                text the dev 𝕏
            </a>
        </div>
    </div>
    <script src="tetris.js?v=1.8"></script>
</body>

</html>
