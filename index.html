<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Premium Tetris</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .main-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 30px;
        }

        #game-container {
            position: relative;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .hud {
            width: 150px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .hud h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            margin-top: 0;
            color: #00f0f0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hud p {
            font-size: 24px;
            font-weight: 600;
            margin: 5px 0 20px 0;
        }

        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #game-over-overlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            color: #ff0055;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            width: 180px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00f0f0;
            box-shadow: 0 0 15px rgba(0, 240, 240, 0.3);
        }

        .btn-primary {
            background: rgba(0, 240, 240, 0.1);
            border-color: rgba(0, 240, 240, 0.3);
        }

        .btn-primary:hover {
            background: rgba(0, 240, 240, 0.2);
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <div id="game-container">
            <div id="game-over-overlay">
                <h2>Game Over</h2>
                <button class="btn btn-primary" id="play-again-btn">Play Again</button>
                <button class="btn" id="quit-btn">Quit</button>
            </div>
        </div>
        <div class="hud">
            <h3>Score</h3>
            <p id="score">0000</p>
            <h3>Level</h3>
            <p id="level">1</p>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>

</html>
