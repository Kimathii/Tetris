<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Premium Tetris</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            /* Dynamic Viewport Height for mobile */
            overflow: hidden;
            touch-action: none;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2dvh;
            height: 100dvh;
            max-width: 100vw;
            padding: 10px;
            box-sizing: border-box;
        }

        .header {
            width: min(300px, 90vw);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .header-stat {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .header-stat h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px;
            margin: 0;
            color: #00f0f0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-stat p {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .header .btn-restart {
            background: rgba(0, 240, 240, 0.1);
            border: 1px solid rgba(0, 240, 240, 0.3);
            color: #fff;
            padding: 6px 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
        }

        #game-container {
            position: relative;
            /* Responsive sizing while maintaining 1:2 ratio */
            height: min(600px, 70vh);
            aspect-ratio: 1 / 2;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            overflow: hidden;
            flex-shrink: 1;
            /* Allow board to shrink if needed */
        }

        #game-over-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-over-overlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(20px, 5vh, 32px);
            color: #ff0055;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        .overlay-btn {
            background: rgba(0, 240, 240, 0.1);
            border: 1px solid rgba(0, 240, 240, 0.3);
            color: #fff;
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px;
            width: 160px;
            text-align: center;
        }

        .footer {
            width: 100%;
            text-align: center;
            flex-shrink: 0;
            padding: 5px 0;
        }

        .dev-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Desktop layout adjustments */
        @media (min-width: 768px) {
            .main-wrapper {
                flex-direction: row;
                justify-content: center;
                gap: 30px;
                padding: 40px;
            }

            .header {
                flex-direction: column;
                width: 150px;
                height: min(600px, 80vh);
                justify-content: flex-start;
                gap: 40px;
                padding: 30px 20px;
            }

            .header-stat h3 {
                font-size: 12px;
            }

            .header-stat p {
                font-size: 20px;
                margin-top: 5px;
            }

            .header .btn-restart {
                width: 100%;
                padding: 12px;
                font-size: 11px;
                margin-top: auto;
            }

            #game-container {
                height: 80vh;
            }

            .footer {
                position: absolute;
                bottom: 15px;
                width: auto;
            }
        }

        /* Small screen height fixes */
        @media (max-height: 500px) and (orientation: landscape) {
            .main-wrapper {
                padding: 5px;
                flex-direction: row;
            }

            .header {
                width: auto;
                height: 90%;
                flex-direction: column;
                gap: 10px;
            }

            #game-container {
                height: 80vh;
            }
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <div class="header">
            <div class="header-stat">
                <h3>Score</h3>
                <p id="score">0000</p>
            </div>
            <div class="header-stat">
                <h3>Level</h3>
                <p id="level">1</p>
            </div>
            <button class="btn-restart" id="header-restart">Restart</button>
        </div>

        <div id="game-container">
            <div id="game-over-overlay">
                <h2>Game Over</h2>
                <button class="overlay-btn" id="play-again-btn">Restart</button>
                <button class="overlay-btn" id="quit-btn"
                    style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);">Quit</button>
            </div>
        </div>

        <div class="footer">
            <a href="https://x.com/_Mathias_Jr_" target="_blank" rel="noopener noreferrer" class="dev-link">
                text the dev 𝕏
            </a>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>

</html>
