<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Premium Tetris</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 100vw;
            padding: 20px;
        }

        @media (min-width: 768px) {
            .main-wrapper {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        #game-container {
            position: relative;
            width: 300px;
            height: 600px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .hud {
            width: 150px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .hud h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            margin-top: 0;
            color: #00f0f0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hud p {
            font-size: 24px;
            font-weight: 600;
            margin: 5px 0 20px 0;
        }

        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #game-over-overlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            color: #ff0055;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        .btn {
            background: rgba(0, 240, 240, 0.1);
            border: 1px solid rgba(0, 240, 240, 0.3);
            color: #fff;
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            width: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover {
            background: rgba(0, 240, 240, 0.2);
            border-color: #00f0f0;
            box-shadow: 0 0 15px rgba(0, 240, 240, 0.3);
        }

        /* Gamepad-style D-pad Styling */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 10px;
            user-select: none;
            justify-content: center;
            margin-bottom: 5px;
        }

        .control-btn {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s ease;
        }

        .control-btn:active {
            background: rgba(0, 240, 240, 0.3);
            border-color: #00f0f0;
            transform: scale(0.95);
        }

        .control-btn.up {
            grid-column: 2;
            grid-row: 1;
            font-size: 24px;
        }

        .control-btn.left {
            grid-column: 1;
            grid-row: 2;
            font-size: 24px;
        }

        .control-btn.right {
            grid-column: 3;
            grid-row: 2;
            font-size: 24px;
        }

        .control-btn.down {
            grid-column: 2;
            grid-row: 3;
            font-size: 10px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            border-radius: 10px;
        }

        .control-btn.empty {
            grid-column: 2;
            grid-row: 2;
            background: none;
            border: none;
            cursor: default;
        }

        /* Special styling for the wide in-game restart button to match post-game */
        #touch-restart {
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <div id="game-container">
            <div id="game-over-overlay">
                <h2>Game Over</h2>
                <button class="btn" id="play-again-btn">Restart</button>
                <button class="btn" id="quit-btn"
                    style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);">Quit</button>
            </div>
        </div>
        <div class="side-panel">
            <div class="hud">
                <h3>Score</h3>
                <p id="score">0000</p>
                <h3>Level</h3>
                <p id="level">1</p>
            </div>

            <div class="d-pad">
                <div class="control-btn up" id="touch-rotate">↻</div>
                <div class="control-btn left" id="touch-left">←</div>
                <div class="control-btn empty"></div>
                <div class="control-btn right" id="touch-right">→</div>
                <div class="control-btn down" id="touch-down">DROP</div>
            </div>
            <button class="btn" id="touch-restart">RESTART</button>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>

</html>
